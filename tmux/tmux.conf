#
# +---------+
# | GENERAL |
# +---------+
#

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf

# Change prefix key to Ctrl-s
# .. C-b is ok, but not usually comfy
# .. C-a is mess with other stuff
# .. C-s smt mess with other stuff
set-option -g prefix C-Space
unbind-key C-b
bind-key C-s send-prefix

# better hotkey for copy-mode
bind-key -T prefix Escape copy-mode

# switch pane by Alt + arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# open panes in {cwd}
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# enable if -> u wan't to name windows manually by <command>+,
# set-option -g allow-rename off

#
# +---------------+
# | DESIGN TWEAKS |
# +---------------+
#

# tab bar at top
set-option -g status-position top

# expanded colors
set -g default-terminal "tmux-256color"

# Make the status line pretty and add some modules
set -g status-justify "absolute-centre"
set -g status-style "bg=default"

# grab color-variables from different file
if-shell '[ -f ~/.config/tmux/colors-catcyber.conf ]' "source-file ~/.config/tmux/colors-catcyber.conf"

# main design tweaks!
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=default,bold]   #S },#{#[bg=default,fg=#{@thm_red},bold]   #I }}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay0}]│"
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=default,bold]   #S },#{#[bg=default,fg=#{@thm_red},bold]   #S }}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay0}]│"
set -ga status-left "#[bg=default,fg=#{@thm_green},bold]   #{pane_current_command} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay0}]│"
set -ga status-left "#[bg=default,fg=#{@thm_blue},bold]   #{=/-10/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# панель справа
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=default,fg=#{@thm_green},bold]  #(uptime | awk '{print $3}' | tr -d ',') "
set -ga status-right "#[bg=default,fg=#{@thm_overlay0}]│"
set -ga status-right " #[fg=#{@thm_green},bold]  #W "
set -ga status-right "#[bg=default,fg=#{@thm_overlay0}]│"
set -ga status-right "#[bg=default,fg=#{@thm_blue},bold]  %H:%M "

# рамки панелей
setw -g pane-border-style "fg=#{@thm_overlay0}"
setw -g pane-active-border-style "fg=#{@thm_red}"
setw -g pane-border-lines single

# иконки окон
set -g window-status-format '#{?#{==:#{pane_current_command},zsh},  ,#{?#{==:#{pane_current_command},nvim},  ,#{?#{==:#{pane_current_command},git}, 󰊢 ,#{?#{==:#{pane_current_command},htop},  ,#{?#{==:#{pane_current_command},python}, 󰌠 ,󰘧 }}}}}'
set -g window-status-current-format '#{?#{==:#{pane_current_command},zsh},  ,#{?#{==:#{pane_current_command},nvim},  ,#{?#{==:#{pane_current_command},git}, 󰊢 ,#{?#{==:#{pane_current_command},htop},  ,#{?#{==:#{pane_current_command},python}, 󰌠 ,󰘧 }}}}}'

set -g window-status-style "bg=default,fg=#{@thm_overlay0}"
set -g window-status-current-style "bg=default,fg=#{@thm_peach},bold"

#
# +----------------------+
# | Better vim-like copy |
# +----------------------+
#

set -g @plugin 'tmux-plugins/tmux-yank'

# set vi-mode
set-window-option -g mode-keys vi

# keymaps
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

#
# +--------------+
# | Base plugins |
# +--------------+
#

# press: <prefix> + F
set -g @plugin 'sainnhe/tmux-fzf'

#
# +--------------+
# | Init plugins |
# +--------------+
# > don't forget to press Ctrl+I in tmux -> to install plugins
#

# REQUIRED for plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# REQUIRED for plugin manager
run '~/.tmux/plugins/tpm/tpm'
